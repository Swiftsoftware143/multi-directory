# Multi-Directory — Docker Compose self-hosted stack (kanban B85).
#
#   cp deploy/.env.example .env      # then edit the secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec app /app/multidirectory create-admin \
#       --email you@example.com
#
# The build context is the repository root (..), so run it from anywhere with -f.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multidirectory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-multi_directory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multidirectory} -d ${POSTGRES_DB:-multi_directory}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Container-to-container: host `db`, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-multidirectory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-multi_directory}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # >= 32 chars; provider API keys are encrypted at rest under this and writes fail closed without it.
      PROVIDER_KEY_ENC_SECRET: ${PROVIDER_KEY_ENC_SECRET:?set PROVIDER_KEY_ENC_SECRET in .env}
      APP_HOST: 0.0.0.0
      APP_PORT: "8089"
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${APP_PORT:-8089}:8089"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # /api/v1/health is the real endpoint; /api/health is a soft-404 (HTTP 200 + SPA HTML).
      test: ["CMD", "sh", "-c", "curl -sf -o /dev/null http://127.0.0.1:8089/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  uploads:
