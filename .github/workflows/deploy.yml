name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  check:
    name: Build + Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to 1.97.1 to match the production box rustc (see rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check
      - name: cargo clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swift
          POSTGRES_PASSWORD: SwiftSecure2026!
          POSTGRES_DB: multidirectory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Pin to 1.97.1 to match the production box rustc (see rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Run migrations
        run: |
          for f in src/migrations/*.sql; do
            PGPASSWORD=SwiftSecure2026! psql -v ON_ERROR_STOP=1 -h localhost -U swift -d multidirectory_test -f "$f"
          done
      - name: cargo test
        run: cargo test
        env:
          DATABASE_URL: postgres://swift:SwiftSecure2026!@localhost:5432/multidirectory_test
          RUST_BACKTRACE: 1
