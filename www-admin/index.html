<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH GUARD — canonical login redirect -->
<script>
!function(){
  var p = window.location.pathname;
  if (p === '/' || p === '/index.html' || p.startsWith('/api/')) return;
}();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Directory — Clearinghouse Admin</title>
<link rel="icon" type="image/svg+xml" href="/admin/favicon.svg">
<link rel="alternate icon" href="/admin/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f1f5f9}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.btn{background:#2563eb;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;border:none;font-weight:500;font-size:14px}
.btn:hover{background:#1d4ed8}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-red{background:#dc2626}
.btn-red:hover{background:#b91c1c}
.btn-green{background:#059669}
.btn-green:hover{background:#047857}
.btn-outline{background:#fff;border:1px solid #cbd5e1;color:#475569}
.btn-outline:hover{background:#f1f5f9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;width:100%;font-size:14px;outline:0;background:#fff}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-content{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:560px;max-height:85vh;overflow-y:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500}
.badge-green{background:#d1fae5;color:#065f46}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-blue{background:#dbeafe;color:#1e40af}
.nav-item{padding:10px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#64748b;font-size:14px;font-weight:500;border:1px solid transparent}
.nav-item:hover{background:#f1f5f9;color:#1e293b}
.nav-item.active{background:#2563eb;color:#fff;border-color:#2563eb}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0}
.table td{padding:10px 12px;font-size:14px;border-bottom:1px solid #f1f5f9}
.table tr:hover td{background:#f8fafc}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-value{font-size:26px;font-weight:700;color:#1e293b}
.stat-label{font-size:13px;color:#64748b;margin-top:4px}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:all .3s;opacity:0;transform:translateY(20px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#dc2626}
.toast.success{background:#059669}
.wrap-flex{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.label{font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;display:block}
</style>
</head>
<body class="min-h-screen">

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- LOGIN VIEW -->
<div id="loginView" class="min-h-screen flex items-center justify-center px-4" style="display:none">
  <div class="card w-full max-w-md">
    <div class="text-center mb-6">
      <div class="text-3xl mb-2">💎</div>
      <h1 class="text-xl font-bold text-slate-800">Clearinghouse Admin</h1>
      <p class="text-sm text-slate-500 mt-1">Multi-Directory · ZaarCash Network Economics</p>
    </div>
    <div>
      <label class="label">Email</label>
      <input id="loginEmail" class="input mb-3" type="email" placeholder="admin@...">
      <label class="label">Password</label>
      <input id="loginPass" class="input mb-4" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      <div id="loginMsg" class="text-red-500 text-sm mb-3" style="display:none"></div>
      <button id="loginBtn" class="btn w-full" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<!-- APP VIEW -->
<div id="appView" class="flex" style="display:none">
  <!-- SIDEBAR -->
  <aside class="w-60 bg-white shadow-sm min-h-screen flex flex-col" style="position:sticky;top:0;height:100vh">
    <div class="p-5 border-b border-slate-100">
      <div class="font-bold text-slate-800">💎 Clearinghouse</div>
      <div class="text-xs text-slate-500 mt-1">Multi-Directory Admin</div>
    </div>
    <nav class="flex-1 p-3 space-y-1" id="nav"></nav>
    <div class="p-4 border-t border-slate-100">
      <div class="text-xs text-slate-500 mb-2" id="userInfo"></div>
      <button class="btn btn-outline btn-sm w-full" onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-6">
    <!-- NETWORK SELECTOR -->
    <div class="card flex flex-wrap items-center gap-3" style="padding:14px 20px">
      <div>
        <label class="label mb-1">Network / City Directory</label>
        <select id="slugSelect" class="input" style="width:240px" onchange="switchNetwork()"></select>
      </div>
      <div id="netBadge" class="ml-auto"></div>
    </div>

    <div id="view"></div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
var TOKEN = localStorage.getItem('md_clearinghouse_token') || '';
var CURRENT_SLUG = localStorage.getItem('md_clearinghouse_slug') || 'zaarhub';
var NETWORKS = [
  {slug:'zaarhub',    label:'ZaarHub (All Cities)'},
  {slug:'palm-bay',   label:'Palm Bay'},
  {slug:'st-petersburg', label:'St. Petersburg'},
  {slug:'apopka',     label:'Apopka'},
  {slug:'boca-raton', label:'Boca Raton'},
  {slug:'hollywood',  label:'Hollywood'},
  {slug:'lake-nona',  label:'Lake Nona'},
  {slug:'palm-coast', label:'Palm Coast'},
  {slug:'pompano-beach', label:'Pompano Beach'},
  {slug:'st-cloud',   label:'St. Cloud'},
  {slug:'winter-garden', label:'Winter Garden'}
];
var VIEWS = ['treasury','caps','ledgers','logs','scan','expire'];

// ─────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────
function toast(msg, type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'error');setTimeout(function(){t.classList.remove('show')},3500);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtMoney(v){var n=parseFloat(v);return isNaN(n)?'$0.00':'$'+n.toFixed(2);}
function fmtTime(ts){if(!ts)return'-';try{var d=new Date(ts);return d.toLocaleString();}catch(e){return String(ts);}}

async function api(path, opts){
  opts = opts||{};
  opts.headers = opts.headers||{};
  if(TOKEN) opts.headers['Authorization']='Bearer '+TOKEN;
  var res = await fetch('/api/v1'+path, opts);
  var data = null;
  try{data = await res.json();}catch(e){}
  if(res.status===401){
    localStorage.removeItem('md_clearinghouse_token');
    showLogin();
    throw new Error('Session expired — please sign in');
  }
  if(!res.ok){
    var msg = (data && (data.error||data.message||data.detail)) ? (data.error||data.message||data.detail) : ('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}
function apiBody(body){return {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};}

// ─────────────────────────────────────────────────────────────
// Auth
// ─────────────────────────────────────────────────────────────
async function doLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPass').value;
  var msg=document.getElementById('loginMsg');
  msg.style.display='none';
  if(!email||!pass){msg.textContent='Email and password required';msg.style.display='block';return;}
  var btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in…';
  try{
    var res=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
    var data=await res.json();
    if(!res.ok) throw new Error(data.error||data.message||'Login failed');
    TOKEN=data.access_token;
    localStorage.setItem('md_clearinghouse_token',TOKEN);
    document.getElementById('userInfo').textContent=(data.user&&data.user.name?data.user.name+' · ':'')+esc(email);
    showApp();
    toast('Signed in','success');
  }catch(e){msg.textContent=e.message;msg.style.display='block';}
  btn.disabled=false;btn.textContent='Sign In';
}
function doLogout(){localStorage.removeItem('md_clearinghouse_token');TOKEN='';showLogin();}
function showLogin(){document.getElementById('loginView').style.display='flex';document.getElementById('appView').style.display='none';}
function showApp(){document.getElementById('loginView').style.display='none';document.getElementById('appView').style.display='flex';renderNav();loadNetwork();}

// ─────────────────────────────────────────────────────────────
// Network selector
// ─────────────────────────────────────────────────────────────
function loadNetwork(){
  var sel=document.getElementById('slugSelect');
  sel.innerHTML='';
  NETWORKS.forEach(function(n){
    var o=document.createElement('option');o.value=n.slug;o.textContent=n.label;
    if(n.slug===CURRENT_SLUG)o.selected=true;
    sel.appendChild(o);
  });
}
function switchNetwork(){CURRENT_SLUG=document.getElementById('slugSelect').value;localStorage.setItem('md_clearinghouse_slug',CURRENT_SLUG);toast('Switched to '+CURRENT_SLUG,'success');renderNav();loadView(currentView||'treasury');}

// ─────────────────────────────────────────────────────────────
// Nav + view routing
// ─────────────────────────────────────────────────────────────
var currentView='treasury';
var NAV_ITEMS=[
  {id:'treasury',label:'📊 Treasury',icon:''},
  {id:'caps',label:'🎯 Category Caps',icon:''},
  {id:'ledgers',label:'🏪 Business Ledgers',icon:''},
  {id:'logs',label:'📜 Clearing Logs',icon:''},
  {id:'scan',label:'🛒 Scan Simulator',icon:''},
  {id:'expire',label:'⏳ Expire Points',icon:''},
  {id:'mcp',label:'🔌 MCP',icon:''}
];
function renderNav(){
  var nav=document.getElementById('nav');nav.innerHTML='';
  NAV_ITEMS.forEach(function(it){
    var d=document.createElement('div');
    d.className='nav-item'+(currentView===it.id?' active':'');
    d.textContent=it.label;
    d.onclick=function(){currentView=it.id;renderNav();loadView(it.id);};
    nav.appendChild(d);
  });
}
function loadView(id){
  currentView=id;renderNav();
  var v=document.getElementById('view');v.innerHTML='<div class="card text-center text-slate-500 py-16">Loading…</div>';
  if(id==='treasury')loadTreasury();
  else if(id==='caps')loadCaps();
  else if(id==='ledgers')loadLedgers();
  else if(id==='logs')loadLogs();
  else if(id==='scan')renderScan();
  else if(id==='expire')renderExpire();
  else if(id==='mcp')loadMcp();
}

// ─────────────────────────────────────────────────────────────
// TREASURY
// ─────────────────────────────────────────────────────────────
async function loadTreasury(){
  var v=document.getElementById('view');
  try{
    var t=await api('/networks/'+CURRENT_SLUG+'/clear/treasury');
    v.innerHTML=
      '<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">'+
      stat('Points Issued',t.total_points_issued)+
      stat('Points Redeemed',t.total_points_redeemed)+
      stat('Revenue Collected',fmtMoney(t.revenue_collected))+
      stat('Reimbursements Paid',fmtMoney(t.reimbursements_paid))+
      stat('Outstanding Liability',fmtMoney(t.outstanding_liability))+
      stat('Minimum Float',fmtMoney(t.minimum_float))+
      '</div>'+
      '<div class="card"><h3 class="font-bold text-slate-800 mb-4">Program Economics</h3>'+
      '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">'+
      econ('Issuance Rate (bill issuing biz)','$0.01 / pt')+
      econ('Redemption Rate (reimburse redeeming)','$0.008 / pt')+
      econ('Platform Spread','20%')+
      econ('Currency','💎 ZaarCash')+
      '</div></div>';
    document.getElementById('netBadge').innerHTML='<span class="badge badge-blue">Network: '+esc(t.network_id?t.network_id.slice(0,8)+'…':'')+'</span>';
  }catch(e){v.innerHTML=errHtml(e);}
}
function stat(l,v){return '<div class="stat-card"><div class="stat-value">'+esc(v==null?'0':v)+'</div><div class="stat-label">'+esc(l)+'</div></div>';}
function econ(l,v){return '<div><div class="text-sm text-slate-500">'+esc(l)+'</div><div class="text-lg font-bold text-slate-800">'+esc(v)+'</div></div>';}
function errHtml(e){return '<div class="card text-red-500">'+esc(e.message||e)+'</div>';}

// ─────────────────────────────────────────────────────────────
// CATEGORY CAPS
// ─────────────────────────────────────────────────────────────
var CAP_CATS=['grocery','fuel','convenience','tobacco','restaurant','retail','services','homegoods','other'];
async function loadCaps(){
  var v=document.getElementById('view');
  try{
    var d=await api('/networks/'+CURRENT_SLUG+'/clear/caps');
    var caps=d.caps||[];
    var rows=caps.map(function(c){
      var pct=parseFloat(c.max_redeem_percent);
      var color=pct<=0?'red':(pct<50?'yellow':'green');
      return '<tr><td class="font-medium">'+esc(c.category)+'</td><td><span class="badge badge-'+color+'">'+esc(c.max_redeem_percent)+'%</span></td><td class="text-slate-500">'+esc(c.description||'-')+'</td>'+
      '<td><button class="btn btn-outline btn-sm" onclick="openCapModal('+"'"+esc(c.category)+"',"+c.max_redeem_percent+","+(c.description?JSON.stringify(c.description):'null')+')">Edit</button></td></tr>';
    }).join('');
    v.innerHTML=
      '<div class="card"><div class="flex items-center justify-between mb-4">'+
      '<h3 class="font-bold text-slate-800">Category Redemption Caps</h3>'+
      '<button class="btn btn-green btn-sm" onclick="openCapModal(\'\',100,null)">+ Add Cap</button></div>'+
      '<p class="text-sm text-slate-500 mb-4">Cap the percentage of an invoice that can be paid with ZaarCash per business category. 0% = no redemption allowed at that category; 100% = unlimited.</p>'+
      '<table class="table"><thead><tr><th>Category</th><th>Max Redeem</th><th>Description</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="text-slate-400 text-center py-6">No caps configured yet</td></tr>')+'</tbody></table></div>';
  }catch(e){v.innerHTML=errHtml(e);}
}
function openCapModal(cat,pct,desc){
  var cats=CAP_CATS.map(function(c){return '<option value="'+c+'"'+(c===cat?' selected':'')+'>'+c+'</option>';}).join('');
  var overlay=document.createElement('div');overlay.className='modal';overlay.id='capModal';
  overlay.innerHTML='<div class="modal-content">'+
    '<h3 class="font-bold text-slate-800 mb-4">'+(cat?'Edit Cap':'Add Cap')+'</h3>'+
    '<label class="label">Category</label>'+
    '<input class="input mb-3" id="capCat" list="capCats" value="'+esc(cat)+'" placeholder="e.g. grocery">'+
    '<datalist id="capCats">'+cats+'</datalist>'+
    '<label class="label">Max Redeem % (0-100)</label>'+
    '<input class="input mb-3" id="capPct" type="number" min="0" max="100" value="'+(pct==null?100:pct)+'">'+
    '<label class="label">Description (optional)</label>'+
    '<input class="input mb-4" id="capDesc" value="'+esc(desc||'')+'" placeholder="e.g. 20% at grocery">'+
    '<div class="flex gap-2 justify-end"><button class="btn btn-outline" onclick="closeCapModal()">Cancel</button>'+
    '<button class="btn btn-green" onclick="saveCap()">Save Cap</button></div></div>';
  document.body.appendChild(overlay);
}
function closeCapModal(){var m=document.getElementById('capModal');if(m)m.remove();}
async function saveCap(){
  var cat=document.getElementById('capCat').value.trim();
  var pct=parseInt(document.getElementById('capPct').value,10);
  var desc=document.getElementById('capDesc').value.trim()||null;
  if(!cat){toast('Category required');return;}
  if(isNaN(pct)||pct<0||pct>100){toast('Cap must be 0-100');return;}
  try{
    var d=await api('/networks/'+CURRENT_SLUG+'/clear/caps',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:cat,max_redeem_percent:pct,description:desc})});
    closeCapModal();toast('Cap saved: '+cat+' → '+pct+'%','success');loadCaps();
  }catch(e){toast(e.message);}
}

// ─────────────────────────────────────────────────────────────
// BUSINESS LEDGERS
// ─────────────────────────────────────────────────────────────
async function loadLedgers(){
  var v=document.getElementById('view');
  try{
    var d=await api('/networks/'+CURRENT_SLUG+'/clear/ledgers');
    var rows=(d.ledgers||[]).map(function(l){
      var net=parseFloat(l.net_position);
      var color=net>=0?'green':'red';
      return '<tr><td class="font-medium">'+esc(l.business_name||'-')+'</td>'+
      '<td>'+esc(l.points_issued)+'</td><td>'+esc(l.points_redeemed)+'</td>'+
      '<td>'+fmtMoney(l.billed)+'</td><td>'+fmtMoney(l.reimbursed)+'</td>'+
      '<td><span class="badge badge-'+color+'">'+fmtMoney(l.net_position)+'</span></td>'+
      '<td class="text-slate-500">'+esc(l.month||'-')+'</td></tr>';
    }).join('');
    v.innerHTML=
      '<div class="card"><h3 class="font-bold text-slate-800 mb-1">Business Ledgers</h3>'+
      '<p class="text-sm text-slate-500 mb-4">Current month, per business. Net position = reimbursed − billed. Positive = business received more than it paid in.</p>'+
      '<table class="table"><thead><tr><th>Business</th><th>Pts Issued</th><th>Pts Redeemed</th><th>Billed</th><th>Reimbursed</th><th>Net Position</th><th>Month</th></tr></thead>'+
      '<tbody>'+(rows||'<tr><td colspan="7" class="text-slate-400 text-center py-6">No ledger activity this month</td></tr>')+'</tbody></table></div>';
  }catch(e){v.innerHTML=errHtml(e);}
}

// ─────────────────────────────────────────────────────────────
// CLEARING LOGS
// ─────────────────────────────────────────────────────────────
async function loadLogs(){
  var v=document.getElementById('view');
  try{
    var d=await api('/networks/'+CURRENT_SLUG+'/clear/logs?limit=100');
    var rows=(d.items||[]).map(function(l){
      var b=l.type==='issue'?'green':'red';var t=l.type==='issue'?'issue':'redeem';
      return '<tr><td><span class="badge badge-'+b+'">'+t+'</span></td>'+
      '<td>'+esc(l.points)+' pts</td>'+
      '<td>'+esc(l.value)+'</td>'+
      '<td>'+esc(l.business||'-')+'</td>'+
      '<td class="text-slate-500 text-xs">'+esc((l.member_id||'').slice(0,8)+'…')+'</td>'+
      '<td class="text-slate-500">'+esc(fmtTime(l.time))+'</td></tr>';
    }).join('');
    v.innerHTML=
      '<div class="card"><h3 class="font-bold text-slate-800 mb-4">Clearing Logs</h3>'+
      '<table class="table"><thead><tr><th>Type</th><th>Points</th><th>Value</th><th>Business</th><th>Member</th><th>Time</th></tr></thead>'+
      '<tbody>'+(rows||'<tr><td colspan="6" class="text-slate-400 text-center py-6">No clearing activity yet</td></tr>')+'</tbody></table>'+
      '<p class="text-xs text-slate-400 mt-3">Showing most recent '+(d.count||0)+' events (limit 100).</p></div>';
  }catch(e){v.innerHTML=errHtml(e);}
}

// ─────────────────────────────────────────────────────────────
// SCAN SIMULATOR (issue / redeem test utility)
// ─────────────────────────────────────────────────────────────
function renderScan(){
  var v=document.getElementById('view');
  v.innerHTML=
  '<div class="card"><h3 class="font-bold text-slate-800 mb-4">Scan Simulator</h3>'+
  '<p class="text-sm text-slate-500 mb-4">Exercise the clearinghouse engine end-to-end: issue ZaarCash on a purchase, or redeem points against an invoice. Use this to verify economics (bill $0.01/pt issued, reimburse $0.008/pt redeemed).</p>'+
  '<div class="grid md:grid-cols-2 gap-6">'+
  '<div class="border border-slate-200 rounded-lg p-4">'+
    '<h4 class="font-bold text-slate-700 mb-3">🛒 Issue (purchase / check-in)</h4>'+
    '<label class="label">Visitor Account UUID</label>'+
    '<input class="input mb-3" id="sVisitor" placeholder="visitor_accounts(id) — must exist in DB">'+
    '<label class="label">Business UUID</label>'+
    '<input class="input mb-3" id="sBiz" placeholder="businesses(id)">'+
    '<label class="label">Business Name</label>'+
    '<input class="input mb-3" id="sBizName" placeholder="Test Restaurant">'+
    '<label class="label">Category</label>'+
    '<select class="input mb-3" id="sCat">'+CAP_CATS.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+'</select>'+
    '<label class="label">Transaction Amount ($)</label>'+
    '<input class="input mb-3" id="sAmt" type="number" step="0.01" value="25.00">'+
    '<button class="btn" onclick="doScan(\'issue\')">Issue ZaarCash</button>'+
  '</div>'+
  '<div class="border border-slate-200 rounded-lg p-4">'+
    '<h4 class="font-bold text-slate-700 mb-3">💸 Redeem (spend points)</h4>'+
    '<label class="label">Visitor Account UUID</label>'+
    '<input class="input mb-3" id="sVisitorR" placeholder="visitor_accounts(id)">'+
    '<label class="label">Business UUID</label>'+
    '<input class="input mb-3" id="sBizR" placeholder="businesses(id)">'+
    '<label class="label">Business Name</label>'+
    '<input class="input mb-3" id="sBizNameR" placeholder="Test Restaurant">'+
    '<label class="label">Category</label>'+
    '<select class="input mb-3" id="sCatR">'+CAP_CATS.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+'</select>'+
    '<label class="label">Invoice Amount ($)</label>'+
    '<input class="input mb-3" id="sAmtR" type="number" step="0.01" value="50.00">'+
    '<label class="label">Points to Redeem</label>'+
    '<input class="input mb-3" id="sPtsR" type="number" value="10">'+
    '<button class="btn btn-red" onclick="doScan(\'redeem\')">Redeem ZaarCash</button>'+
  '</div></div>'+
  '<div id="scanResult" class="mt-4"></div></div>';
}
async function doScan(kind){
  var res=document.getElementById('scanResult');
  var body;
  if(kind==='issue'){
    body={
      visitor_account_id:document.getElementById('sVisitor').value.trim(),
      business_id:document.getElementById('sBiz').value.trim(),
      business_name:document.getElementById('sBizName').value.trim()||'Test Business',
      business_category:document.getElementById('sCat').value,
      scan_type:'purchase',
      transaction_amount:parseFloat(document.getElementById('sAmt').value)||0,
      transaction_id:'admin-scan-'+Date.now()
    };
  }else{
    body={
      visitor_account_id:document.getElementById('sVisitorR').value.trim(),
      business_id:document.getElementById('sBizR').value.trim(),
      business_name:document.getElementById('sBizNameR').value.trim()||'Test Business',
      business_category:document.getElementById('sCatR').value,
      scan_type:'redeem',
      transaction_amount:parseFloat(document.getElementById('sAmtR').value)||0,
      points:parseInt(document.getElementById('sPtsR').value,10)||0,
      transaction_id:'admin-redeem-'+Date.now()
    };
  }
  res.innerHTML='<div class="text-slate-500 py-3">Processing '+(kind==='issue'?'issuance…':'redemption…')+'</div>';
  try{
    var d=await api('/networks/'+CURRENT_SLUG+'/clear/scan',apiBody(body));
    res.innerHTML='<div class="bg-green-50 border border-green-200 rounded-lg p-4 text-sm">'+
      '<div class="font-bold text-green-700 mb-1">✔ '+(d.status==='issued'?'ZaarCash Issued':'ZaarCash Redeemed')+'</div>'+
      '<pre class="whitespace-pre-wrap text-slate-600 text-xs mt-2">'+esc(JSON.stringify(d,null,2))+'</pre></div>';
    toast('Scan complete','success');
  }catch(e){res.innerHTML='<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-600">'+esc(e.message)+'</div>';}
}

function renderExpire(){
  var v=document.getElementById('view');
  v.innerHTML='<div class="card max-w-2xl"><h3 class="font-bold text-slate-800 mb-2">⏳ Expire Stale Points</h3>'+
  '<p class="text-sm text-slate-500 mb-4">Run rolling 12-month expiry: any ZaarCash earned more than 365 days ago is removed from member balances and the treasury liability. This is the cron-triggerable endpoint.</p>'+
  '<label class="label">Network</label><div class="text-slate-700 font-medium mb-3">'+esc(CURRENT_SLUG)+'</div>'+
  '<button class="btn btn-red" onclick="doExpire()">Run Expiry Now</button>'+
  '<div id="expireResult" class="mt-4"></div></div>';
}
async function doExpire(){
  var r=document.getElementById('expireResult');
  r.innerHTML='<div class="text-slate-500 py-3">Running rolling expiry…</div>';
  try{
    var d=await api('/networks/'+CURRENT_SLUG+'/clear/expire',{method:'POST'});
    r.innerHTML='<div class="bg-green-50 border border-green-200 rounded-lg p-4 text-sm">'+
      '<div class="font-bold text-green-700 mb-1">✔ Expiry completed</div>'+
      '<div class="text-slate-600">Points expired: <b>'+esc(d.total_points_expired)+'</b> · Members affected: <b>'+esc(d.members_affected)+'</b></div>'+
      '<div class="text-xs text-slate-400 mt-1">Cutoff: '+esc(d.cutoff||'-')+'</div></div>';
    toast('Expiry complete','success');
  }catch(e){r.innerHTML='<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-600">'+esc(e.message)+'</div>';}
}

// ─────────────────────────────────────────────────────────────
// MCP — internal fleet surface (read-only)
// ─────────────────────────────────────────────────────────────
var MCP_TOOLS=[
  ['multi_directory_list_directories','Directories with city/state, the locations they serve and their listing count.'],
  ['multi_directory_search_listings','Search business listings by name or description, optionally by category or directory.'],
  ['multi_directory_listing_count','Total business listings visible to this credential, optionally scoped to one directory.'],
  ['multi_directory_subscriber_count','Newsletter subscriber totals, optionally scoped to one directory.']
];
var MCP_CONFIG_TEXT='{\n'
 +'  "mcpServers": {\n'
 +'    "multi-directory": {\n'
 +'      "url": "https://hooks.swiftsoftware.net/mcp",\n'
 +'      "headers": { "Authorization": "Bearer YOUR_API_KEY" }\n'
 +'    }\n'
 +'  }\n'
 +'}';
var MCP_LAST_KEY='';

async function mcpReq(path, opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  if(TOKEN) opts.headers['Authorization']='Bearer '+TOKEN;
  var res=await fetch('/api/v1'+path, opts);
  var data=null;
  try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    var msg=(data&&(data.error||data.message||data.detail))?(data.error||data.message||data.detail):('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}

function loadMcp(){
  var v=document.getElementById('view');
  v.innerHTML=
    '<div class="card"><h3 class="font-bold text-slate-800 mb-1">MCP — connect your AI tools</h3>'+
    '<p class="text-sm text-slate-500 mb-4">This is an <b>internal fleet surface</b> for Multi-Directory (ZaarHub) — not a customer feature. Point an internal MCP client at the endpoint below with this admin’s API key as the Bearer token. Read-only, and scoped to the directories this admin owns.</p>'+
    '<div class="border border-slate-200 rounded-lg p-4 mb-3">'+
      '<div class="label">Endpoint</div>'+
      '<div class="flex items-center gap-2 flex-wrap">'+
        '<code class="px-2 py-1 bg-slate-100 rounded text-xs">https://hooks.swiftsoftware.net/mcp</code>'+
        '<button class="btn btn-outline btn-sm" onclick="mcpClip(\'https://hooks.swiftsoftware.net/mcp\')">Copy</button>'+
      '</div>'+
    '</div>'+
    '<div class="border border-slate-200 rounded-lg p-4 mb-3">'+
      '<div class="label">Your token</div>'+
      '<p class="text-xs text-slate-400 mb-2">The MCP server accepts this admin’s API key as a Bearer token. It is listed here by prefix only — the secret is never shown until you Reveal it (which re-asks for your password). Treat it like a password.</p>'+
      '<div id="mcp-key-list" class="mb-2"></div>'+
      '<div id="mcp-key-out"></div>'+
    '</div>'+
    '<div class="border border-slate-200 rounded-lg p-4 mb-3">'+
      '<div class="label">What it can read</div>'+
      '<ul class="text-xs text-slate-600 leading-6 pl-4 list-disc">'+mcpToolsHtml()+'</ul>'+
      '<p class="text-xs text-slate-400 mt-2">Every tool is a SELECT. There is no write tool and no free-form SQL door.</p>'+
    '</div>'+
    '<div class="border border-slate-200 rounded-lg p-4 mb-3">'+
      '<div class="label">Connect</div>'+
      '<p class="text-xs text-slate-400 mb-2">Paste into your MCP client config (Claude Desktop / Cursor). Replace YOUR_API_KEY with this admin’s key.</p>'+
      '<pre class="text-xs bg-slate-900 text-slate-100 p-3 rounded overflow-x-auto">'+esc(MCP_CONFIG_TEXT)+'</pre>'+
      '<button class="btn btn-outline btn-sm mt-2" onclick="mcpClip(MCP_CONFIG_TEXT)">Copy config</button>'+
    '</div>'+
    '</div>';
  mcpLoadKey();
}
function mcpToolsHtml(){
  return MCP_TOOLS.map(function(t){
    return '<li><code class="text-indigo-600">'+esc(t[0])+'</code> — '+esc(t[1])+'</li>';
  }).join('');
}
function mcpClip(t){
  var ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); ok=true; } }catch(e){}
  if(!ok){ try{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); document.body.removeChild(ta); }catch(e){} }
  toast(ok?'Copied':'Could not copy automatically — select and press Ctrl+C', ok?'success':'error');
}
function mcpLoadKey(){
  var box=document.getElementById('mcp-key-list'); if(!box) return;
  mcpReq('/me/api-keys').then(function(d){
    var ks=(d&&d.keys)||[];
    var live=ks.filter(function(k){return k.is_active;});
    if(!live.length){ box.innerHTML='<p class="text-sm text-slate-400">No active API keys yet.</p>'; return; }
    var h='';
    live.forEach(function(k){
      h+='<div class="flex items-center justify-between gap-2 py-2 border-b border-slate-100">'+
        '<span class="text-sm"><strong>'+esc(k.name||'API key')+'</strong> '+
        '<code class="text-xs text-indigo-600">'+esc(k.prefix)+'&hellip;</code></span>'+
        '<span class="text-xs whitespace-nowrap">'+
        '<a href="#" class="text-blue-600 mr-2" onclick="event.preventDefault();mcpReveal(\''+k.id+'\',false)">Reveal</a>'+
        '<a href="#" class="text-blue-600 mr-2" onclick="event.preventDefault();mcpReveal(\''+k.id+'\',true)">Copy</a>'+
        '<a href="#" class="text-amber-600" onclick="event.preventDefault();mcpRegen(\''+k.id+'\')">Regenerate</a>'+
        '</span></div>';
    });
    box.innerHTML=h;
  }).catch(function(e){ box.innerHTML='<p class="text-sm text-red-500">'+esc(e.message||'Could not load API keys')+'</p>'; });
}
function mcpReveal(id,copyOnly){
  var pw=prompt('Enter your account password to reveal this key');
  if(pw===null) return;
  mcpReq('/me/api-keys/'+id+'/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){
    var tok=r.key||'';
    if(copyOnly){ mcpClip(tok); return; }
    mcpShow('You can reveal this key again any time.',tok);
  }).catch(function(e){ toast(e.message||'Could not reveal the key — check the password'); });
}
function mcpShow(note,tok){
  MCP_LAST_KEY=tok;
  var box=document.getElementById('mcp-key-out'); if(!box) return;
  box.innerHTML='<div class="flex items-center gap-2 flex-wrap bg-blue-50 border border-blue-200 rounded p-2">'+
    '<input readonly value="'+esc(tok)+'" class="input flex-1 text-xs" onfocus="this.select()">'+
    '<button class="btn btn-sm" onclick="mcpClip(MCP_LAST_KEY)">Copy</button>'+
    (note?'<span class="text-xs text-slate-600">'+esc(note)+'</span>':'')+'</div>';
}
function mcpRegen(id){
  if(!confirm('Regenerate this key? The old key stops working immediately, so anything using it — including any connected MCP client — must be updated with the new one.')) return;
  mcpReq('/me/api-keys/'+id+'/regenerate',{method:'POST'}).then(function(r){
    mcpShow('The old key no longer works. Use this new one in your MCP client.',r.key);
    mcpLoadKey();
  }).catch(function(e){ toast(e.message||'Could not regenerate the key'); });
}

  if(TOKEN){showApp();}else{showLogin();}
})();
