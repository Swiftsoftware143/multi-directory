<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZaarHub Analytics Dashboard</title>
<style>
:root {
  --brand: #f27f2f; --brand-dark: #2b3255; --bg: #f8f9fc; --card: #ffffff;
  --text: #1a1a2e; --text-muted: #6b7280; --border: #e5e7eb;
  --green: #16a34a; --red: #ef4444; --blue: #3b82f6; --purple: #8b5cf6;
  --radius: 14px; --shadow: 0 1px 3px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:var(--brand-dark);color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;font-weight:800}header h1 span{color:var(--brand)}
header nav a{color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;font-weight:500;margin-left:16px}
header nav a:hover{color:var(--brand)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px}
.card .value{font-size:28px;font-weight:800}
.card .value.green{color:var(--green)}.card .value.orange{color:var(--brand)}.card .value.blue{color:var(--blue)}.card .value.purple{color:var(--purple)}
.chart-section{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
.chart-section h2{font-size:16px;font-weight:700;margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:40px}
.bar{width:100%;max-width:50px;background:var(--brand);border-radius:6px 6px 0 0;transition:height .3s;min-height:2px}
.bar-label{font-size:9px;color:var(--text-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50px}
.bar-count{font-size:10px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
tr:hover td{background:var(--bg)}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
.badge.green{background:#dcfce7;color:#166534}.badge.orange{background:#fff7f0;color:var(--brand)}.badge.blue{background:#dbeafe;color:#1d4ed8}
.metric-row{display:flex;gap:8px;align-items:center}
.progress-bar{width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;background:var(--green)}
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:2px solid var(--border)}
.tab{padding:10px 20px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--brand)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.loading{text-align:center;padding:48px;color:var(--text-muted)}
.empty{text-align:center;padding:48px;color:var(--text-muted)}
@media(max-width:768px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <h1>Zaar<span>Hub</span> Analytics</h1>
  <nav>
    <a href="https://zaarhub.com">Home</a>
    <a href="/zaarhub">Cities</a>
  </nav>
</header>

<div class="page">
  <!-- Overview cards -->
  <div class="cards" id="overview-cards">
    <div class="card"><div class="label">Total Cities</div><div class="value blue" id="v-cities">—</div></div>
    <div class="card"><div class="label">Listings</div><div class="value" id="v-listings">—</div></div>
    <div class="card"><div class="label">Active Offers</div><div class="value orange" id="v-offers">—</div></div>
    <div class="card"><div class="label">Total Claims</div><div class="value purple" id="v-claims">—</div></div>
    <div class="card"><div class="label">Claims Today</div><div class="value green" id="v-today">—</div></div>
    <div class="card"><div class="label">Redemption Rate</div><div class="value orange" id="v-rate">—</div></div>
  </div>

  <!-- Weekly trend chart -->
  <div class="chart-section">
    <h2>📊 Claims — Last 7 Days</h2>
    <div class="bar-chart" id="weekly-chart"><div class="loading">Loading...</div></div>
  </div>

  <!-- Tabs: Offers, Claims, Cities, Categories -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab(this,'offers')">Top Offers</button>
    <button class="tab" onclick="switchTab(this,'claims')">Recent Claims</button>
    <button class="tab" onclick="switchTab(this,'cities')">City Performance</button>
    <button class="tab" onclick="switchTab(this,'categories')">Categories</button>
  </div>

  <div class="chart-section" id="tab-content">
    <div class="loading">Loading...</div>
  </div>
</div>

<script>
const API = '/api/v1/zaarhub/analytics';
let currentTab = 'offers';

async function init() {
  try {
    const res = await fetch(`${API}/overview`);
    const d = await res.json();
    const t = d.totals;
    document.getElementById('v-cities').textContent = t.cities;
    document.getElementById('v-listings').textContent = t.listings.toLocaleString();
    document.getElementById('v-offers').textContent = t.active_offers;
    document.getElementById('v-claims').textContent = t.total_claims.toLocaleString();
    document.getElementById('v-today').textContent = t.claims_today;
    document.getElementById('v-rate').textContent = t.redemption_rate;

    // Weekly chart
    const chart = document.getElementById('weekly-chart');
    if (d.weekly_trend?.length) {
      const max = Math.max(1, ...d.weekly_trend.map(w => w.claims));
      chart.innerHTML = d.weekly_trend.map(w => {
        const pct = (w.claims / max * 100).toFixed(0);
        const date = w.date.slice(5);
        return `<div class="bar-item"><span class="bar-count">${w.claims}</span><div class="bar" style="height:${pct}%"></div><span class="bar-label">${date}</span></div>`;
      }).join('');
    } else {
      chart.innerHTML = '<div class="empty" style="width:100%">No claims yet this week</div>';
    }
  } catch(e) { console.error(e); }

  loadTab(currentTab);
}

async function loadTab(tab) {
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="loading">Loading...</div>';

  try {
    let url, headers, rows;
    switch(tab) {
      case 'offers':
        url = `${API}/offers?per_page=50`;
        break;
      case 'claims':
        url = `${API}/claims?per_page=50`;
        break;
      case 'cities':
        url = `${API}/cities`;
        break;
      case 'categories':
        url = `${API}/categories`;
        break;
    }
    const res = await fetch(url);
    const d = await res.json();

    if (tab === 'offers') renderOffers(d.offers, el);
    else if (tab === 'claims') renderClaims(d.claims, el);
    else if (tab === 'cities') renderCities(d.cities, el);
    else if (tab === 'categories') renderCategories(d.categories, el);
  } catch(e) {
    el.innerHTML = '<div class="empty">⚠️ Failed to load data</div>';
  }
}

function renderOffers(offers, el) {
  if (!offers?.length) { el.innerHTML = '<div class="empty">No offers yet</div>'; return; }
  let html = `<table><thead><tr><th>Offer</th><th>Business</th><th>Type</th><th>Discount</th><th>Claims</th><th>Redeemed</th><th>Rate</th></tr></thead><tbody>`;
  offers.forEach(o => {
    html += `<tr>
      <td><strong>${esc(o.offer_title)}</strong></td>
      <td>${esc(o.business_name)} <span class="badge orange">${esc(o.category||'')}</span></td>
      <td><span class="badge blue">${esc(o.offer_type)}</span></td>
      <td>${esc(o.discount_value||'—')}</td>
      <td><strong>${o.total_claims}</strong> ${o.max_claims ? `/ ${o.max_claims}` : ''}</td>
      <td>${o.total_redeemed}</td>
      <td><span class="badge ${parseFloat(o.redemption_rate) > 20 ? 'green' : 'orange'}">${o.redemption_rate}</span></td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderClaims(claims, el) {
  if (!claims?.length) { el.innerHTML = '<div class="empty">No claims yet</div>'; return; }
  let html = `<table><thead><tr><th>Time</th><th>Business</th><th>Offer</th><th>Promo Code</th><th>Email/Phone</th><th>Status</th></tr></thead><tbody>`;
  claims.forEach(c => {
    const email = c.email || c.phone || c.visitor_id?.slice(0,8) || 'anon';
    const status = c.redeemed ? '<span class="badge green">✅ Redeemed</span>' : '<span class="badge orange">📋 Claimed</span>';
    html += `<tr>
      <td>${c.claimed_at?.replace('T',' ')?.slice(0,19) || '—'}</td>
      <td><strong>${esc(c.business_name)}</strong></td>
      <td>${esc(c.offer_title)}</td>
      <td><code>${c.promo_code || '—'}</code></td>
      <td>${esc(email)}</td>
      <td>${status}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderCities(cities, el) {
  if (!cities?.length) { el.innerHTML = '<div class="empty">No city data</div>'; return; }
  let html = `<table><thead><tr><th>City</th><th>Listings</th><th>Offers</th><th>Claims</th><th>Redeemed</th><th>Rate</th></tr></thead><tbody>`;
  cities.forEach(c => {
    html += `<tr>
      <td><a href="/zaarhub/${c.city_slug}" style="color:var(--brand);font-weight:700">${esc(c.city_name)}</a></td>
      <td>${c.listing_count.toLocaleString()}</td>
      <td>${c.offer_count}</td>
      <td><strong>${c.claim_count}</strong></td>
      <td>${c.redeemed_count}</td>
      <td><span class="badge ${parseFloat(c.redemption_rate) > 20 ? 'green' : 'orange'}">${c.redemption_rate}</span></td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderCategories(cats, el) {
  if (!cats?.length) { el.innerHTML = '<div class="empty">No category data</div>'; return; }
  let html = `<table><thead><tr><th>Category</th><th>Listings</th><th>Offers</th><th>Claims</th></tr></thead><tbody>`;
  cats.forEach(c => {
    html += `<tr>
      <td><strong>${esc(c.category)}</strong></td>
      <td>${c.listing_count.toLocaleString()}</td>
      <td>${c.offer_count}</td>
      <td>${c.claim_count}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function switchTab(btn, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentTab = tab;
  loadTab(tab);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
