<!--
  LEGACY ALIAS — RETIRED. Do not add anything here.

  This file used to be a second, older admin console (30,787 B: its own sidebar with
  dashboard/directories/listings/users/settings/sponsored/notifications, its own token key
  `ws_dir_token`). It was the redirect target of /admin-login.html, which /pricing-admin.html

  was NOT the platform admin panel.

  THE ONE ADMIN SHELL IS frontend/admin-panel.html, served at /admin-panel (and /admin-panel.html).
  It has its own sign-in form and stores the JWT under `md_admin_token`.
  Decision recorded under kanban t_75eafc33 (2026-10-03); rationale in docs/admin-guide.md
  ("Canonical admin surface"). This file exists ONLY so an old bookmark or an external link
  does not fall through to the SPA soft-404.
-->
<link rel="canonical" href="/admin-panel">
<meta http-equiv="refresh" content="0; url=/admin-panel">
<title>Admin — moved to /admin-panel</title>
</head>
<body>
<script>location.replace('/admin-panel');</script>
<p>This page has moved to the admin panel: <a href="/admin-panel">/admin-panel</a></p>
</body>
